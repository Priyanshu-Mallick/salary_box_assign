name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
      - run: uv sync --frozen --dev --group face
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: apps/mobile
        run: flutter pub get
      - working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs
      - working-directory: apps/mobile
        run: dart run tool/compact_generated.dart
      - working-directory: apps/mobile
        run: dart run tool/check_format.dart
      - working-directory: apps/mobile
        run: dart run tool/check_file_size.dart
      - working-directory: apps/mobile
        run: flutter analyze
      - working-directory: apps/mobile
        run: flutter test
      - working-directory: apps/mobile
        run: flutter build apk --debug --dart-define-from-file=.env.example
